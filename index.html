<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peent. - Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; }
        .product-card { transition: all 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="p-6 flex justify-between items-center bg-white border-b border-gray-100 sticky top-0 z-40 shadow-sm">
        <h1 class="text-2xl font-bold tracking-tighter text-black uppercase">Peent.</h1>
        <div class="space-x-6 text-sm font-medium">
            <a href="https://shopee.co.id/peent.up" target="_blank" class="hover:text-gray-500 text-black">Shopee</a>
        </div>
    </nav>

    <header class="max-w-6xl mx-auto px-6 pt-16 pb-8 text-center">
        <h2 class="text-4xl font-bold mb-4">Our Catalog</h2>
        <p class="text-gray-500">Koleksi perlengkapan esensial untuk mobilitas Anda.</p>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-12">
        <!-- Container untuk daftar produk -->
        <div id="catalog-container" class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <!-- Produk akan muncul di sini secara otomatis melalui JavaScript -->
        </div>
    </main>

    <footer class="py-12 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-400">&copy; 2026 Peent. All rights reserved.</p>
    </footer>

    <script>
        const daftarProduk = [
            {
                nama: "Peent Cache Sling Bag",
                harga: "Rp 285.000",
                deskripsi: "Terbuat dari bahan Cordura nylon, Series Cache adalah tas yang didesain untuk menemani jalan-jalan, bersepeda, atau bekerja.",
                gambar: "https://i.imgur.com/040Uq9E.jpg",
                linkShopee: "https://shopee.co.id/peent.up"
            },
            {
                nama: "Peent Adjustable Stabilizer v.2 Strap",
                harga: "Rp 76.000",
                deskripsi: "Quick magnetic fastening (one-hand use). Designed to keep your carry clean, stable, and comfortable.",
                gambar: "https://i.imgur.com/x0nx4D4.png",
                linkShopee: "https://shopee.co.id/Peent.-Adjustable-Stabilizer-v.2-Strap.-Magnetic-Buckle.-Aksesori-Tas-Selempang-Sidepack.-Camera.-Cycling.-i.1492305909.46709938687"
            }
            // Tambahkan produk baru di sini dengan format yang sama
        ];

        const catalogContainer = document.getElementById('catalog-container');

        // Fungsi untuk merender semua produk
        function renderCatalog() {
            catalogContainer.innerHTML = daftarProduk.map(produk => `
                <div class="product-card bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col">
                    <div class="aspect-square overflow-hidden bg-gray-200">
                        <img src="${produk.gambar}" class="w-full h-full object-cover" alt="${produk.nama}">
                    </div>
                    <div class="p-8 flex flex-col flex-grow">
                        <h3 class="text-2xl font-bold mb-2">${produk.nama}</h3>
                        <p class="text-xl text-gray-600 font-light mb-4">${produk.harga}</p>
                        <p class="text-gray-500 text-sm leading-relaxed mb-6 flex-grow">${produk.deskripsi}</p>
                        <a href="${produk.linkShopee}" target="_blank" 
                           class="block w-full text-center bg-black text-white py-4 rounded-full font-semibold hover:bg-gray-800 transition-colors shadow-md active:scale-95">
                            Beli di Shopee
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Jalankan fungsi saat halaman dimuat
        renderCatalog();
    </script>

</body>
</html>
