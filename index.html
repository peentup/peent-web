<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peent. - Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; }
        .swiper { width: 100%; height: 100%; border-radius: 1rem; }
        .swiper-button-next, .swiper-button-prev { color: #000 !important; transform: scale(0.7); }
        .swiper-pagination-bullet-active { background: #000 !important; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <nav class="p-6 flex justify-between items-center bg-white border-b border-gray-100 sticky top-0 z-40 shadow-sm">
        <h1 class="text-2xl font-bold tracking-tighter text-black uppercase">Peent.</h1>
        <div class="space-x-6 text-sm font-medium">
            <a href="https://shopee.co.id/peent.up" target="_blank" class="hover:text-gray-500 text-black">Shopee</a>
        </div>
    </nav>

    <!-- Container Utama untuk menampung semua produk -->
    <div id="app-container"></div>

    <!-- Lightbox (Hanya satu untuk semua produk) -->
    <div id="lightbox" class="fixed inset-0 z-[60] hidden bg-black/95 flex items-center justify-center p-4" onclick="closeLightbox()">
        <button class="absolute top-4 right-6 text-white text-5xl">&times;</button>
        <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain rounded-lg">
    </div>

    <footer class="py-12 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-400">&copy; 2026 Peent. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const daftarProduk = [
            {
                nama: "Peent Cache Sling Bag",
                harga: "Rp 285.000",
                deskripsi: "Terbuat dari bahan Cordura nylon, Series Cache adalah tas yang didesain untuk menemani jalan jalan, bersepeda, atau bekerja. Kompartemen utama di dalamnya terdapat sekat Laptop sampai 14 inci.",
                dimensi: "36cm x 11cm x 30cm (Volume 11 L)",
                bahan: "Cordura Nylon 1000D Glossy / Polyester WP Lining / Mesh fabric / YKK Zipper",
                linkShopee: "https://shopee.co.id/peent.up",
                gambar: [
                    "https://i.imgur.com/040Uq9E.jpg",
                    "https://i.imgur.com/ANonCFm.jpeg",
                    "https://i.imgur.com/92mTTkL.jpeg",
                    "https://i.imgur.com/SC3sZjC.jpeg"
                ]
            },
            {
                nama: "Peent Adjustable Stabilizer v.2 Strap",
                harga: "Rp 76.000",
                deskripsi: "One-side adjustable strap / Quick magnetic fastening (one-hand use) / Secure snap attachment to main strap / Compatible with most sling/crossbody bags.",
                dimensi: "Adjustable length: 25 cm – 70 cm, Strap width: 2 cm",
                bahan: "Premium 2cm Nylon Webbing / Magnetic Buckle / Acetal Hardware / Snap Button",
                linkShopee: "https://shopee.co.id/Peent.-Adjustable-Stabilizer-v.2-Strap.-Magnetic-Buckle.-Aksesori-Tas-Selempang-Sidepack.-Camera.-Cycling.-i.1492305909.46709938687",
                gambar: [
                    "https://i.imgur.com/x0nx4D4.png",
                    "https://i.imgur.com/JMuD6SS.png",
                    "https://i.imgur.com/kViydWJ.png",
                    "https://i.imgur.com/oMHZNjr.png"
                ]
            }
        ];

        function renderProduk() {
            const container = document.getElementById('app-container');
            
            container.innerHTML = daftarProduk.map((produk, idx) => `
                <main class="max-w-6xl mx-auto px-6 py-12 md:py-20 flex flex-col md:flex-row items-start gap-12 border-b border-gray-200">
                    <div class="w-full md:w-1/2">
                        <div class="aspect-square bg-gray-200 rounded-2xl overflow-hidden relative shadow-sm">
                            <div class="swiper mySwiper-${idx}">
                                <div class="swiper-wrapper">
                                    ${produk.gambar.map(img => `<div class="swiper-slide"><img src="${img}" class="w-full h-full object-cover"></div>`).join('')}
                                </div>
                                <div class="swiper-button-next"></div>
                                <div class="swiper-button-prev"></div>
                                <div class="swiper-pagination"></div>
                            </div>
                        </div>
                        <div class="grid grid-cols-4 gap-2 mt-4">
                            ${produk.gambar.map(img => `
                                <div class="aspect-square rounded-lg overflow-hidden bg-gray-100">
                                    <img src="${img}" class="w-full h-full object-cover cursor-pointer hover:opacity-75" onclick="openLightbox('${img}')">
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="w-full md:w-1/2 space-y-6">
                        <div class="space-y-2">
                            <h2 class="text-4xl font-bold">${produk.nama}</h2>
                            <p class="text-2xl font-light text-gray-600">${produk.harga}</p>
                        </div>
                        <p class="text-gray-600 leading-relaxed">${produk.deskripsi}</p>
                        <a href="${produk.linkShopee}" target="_blank" class="inline-block w-full md:w-auto text-center bg-black text-white px-12 py-4 rounded-full font-semibold hover:bg-gray-800 transition-all shadow-md active:scale-95">Beli di Shopee</a>
                        <div class="pt-6 border-t border-gray-200 space-y-4">
                            <div><h4 class="text-xs font-bold uppercase text-gray-400">Dimensions</h4><p class="text-sm">${produk.dimensi}</p></div>
                            <div><h4 class="text-xs font-bold uppercase text-gray-400">Materials</h4><p class="text-sm text-gray-600">${produk.bahan}</p></div>
                        </div>
                    </div>
                </main>
            `).join('');

            // Inisialisasi semua swiper
            daftarProduk.forEach((_, idx) => {
                new Swiper(`.mySwiper-${idx}`, {
                    loop: true,
                    pagination: { el: ".swiper-pagination", clickable: true },
                    navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" }
                });
            });
        }

        function openLightbox(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        renderProduk();
    </script>
</body>
</html>
